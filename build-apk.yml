name: Build Alhowail Field APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name shown in the app info (e.g. 1.0, 1.1)"
        required: true
        default: "1.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Create the Android project
        run: |
          rm -rf android
          npx cap add android
          node scripts/patch-android.js
          npx cap sync android

      - name: Restore the signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing (see README step 2)"; exit 1; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/alhowail.p12"

      - name: Build the signed APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/alhowail.p12
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Alhowail-Field.apk"

      - name: "Publish the release (permanent link: releases/latest/download/Alhowail-Field.apk)"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ inputs.version }}-${{ github.run_number }}
          name: Alhowail Field ${{ inputs.version }} (build ${{ github.run_number }})
          make_latest: true
          files: Alhowail-Field.apk
          body: |
            Install: open this link on the salesman's Android phone and tap the APK.
            Updates of the screens come automatically from GitHub Pages; a new APK is only needed for native changes.
