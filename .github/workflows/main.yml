name: Build Alhowail Field APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name (e.g. 1.0, 1.1)"
        required: true
        default: "1.0"

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: |
          rm -rf android

          npx cap add android

          node patch-android.js

          # Capacitor needs the Android assets directory
          # even when server.url is used.
          mkdir -p android/app/src/main/assets/public

          npx cap sync android

      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/alhowail.p12"

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/alhowail.p12
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

          cp app/build/outputs/apk/release/app-release.apk \
            "$GITHUB_WORKSPACE/Alhowail-Field.apk"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ inputs.version }}-${{ github.run_number }}
          name: Alhowail Field ${{ inputs.version }} (build ${{ github.run_number }})
          make_latest: true
          files: Alhowail-Field.apk
          body: |
            Alhowail Field APK version ${{ inputs.version }}
